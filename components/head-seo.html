<!-- Terrnix Shared SEO Head Template — Include in all public pages -->
<!-- Usage: Copy this block into each page's <head>, then customize the variables -->

<!-- Required for every page -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="alternate icon" href="/assets/favicon.ico">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Design System -->
<link rel="stylesheet" href="/components/design-system.css">

<!-- Page Title (customize per page) -->
<title>{{PAGE_TITLE}} | Terrnix</title>

<!-- Meta Description (customize per page, 150-160 chars) -->
<meta name="description" content="{{PAGE_DESCRIPTION}}">

<!-- Canonical URL (customize per page) -->
<link rel="canonical" href="{{CANONICAL_URL}}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Terrnix">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="https://terrnix.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@TerrnixHQ">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">
<meta name="twitter:image" content="https://terrnix.com/assets/og-image.png">

<!-- Organization Schema (JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Terrnix",
  "url": "https://terrnix.com",
  "logo": "https://terrnix.com/assets/logo.png",
  "sameAs": [
    "https://linkedin.com/company/terrnix",
    "https://x.com/TerrnixHQ",
    "https://github.com/talal-rgb/ecosphere-sustainability"
  ],
  "description": "AI-powered sustainability intelligence for carbon accounting, ESG reporting, and climate compliance.",
  "foundingDate": "2024",
  "areaServed": "Global",
  "knowsAbout": [
    "Carbon Accounting",
    "ESG Reporting",
    "GHG Protocol",
    "CSRD",
    "ISSB",
    "Climate Compliance",
    "Sustainability Intelligence"
  ]
}
</script>

<!-- WebSite Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Terrnix",
  "url": "https://terrnix.com",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://terrnix.com/sustainability-intelligence/?search={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- Security Headers (meta equivalents for static hosting) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://terrnix-backend.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()">

<!-- Theme Color -->
<meta name="theme-color" content="#0a0f0d">
<meta name="msapplication-TileColor" content="#0a0f0d">

<!-- Robots -->
<meta name="robots" content="index, follow, max-image-preview:large">
