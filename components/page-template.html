<!-- ============================================================
   Terrnix Page Template
   Copy this as the starting point for every public page.
   Replace {{VARIABLES}} with page-specific content.
   ============================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="alternate icon" href="/assets/favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CDN (temporary — migrate to build process) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          colors: {
            terrnix: {
              bg: '#0a0f0d',
              'bg-secondary': '#111a16',
              'bg-tertiary': '#1a2620',
              border: '#2d3d35',
              emerald: '#10b981',
              'emerald-light': '#34d399',
              cyan: '#06b6d4',
              'cyan-light': '#22d3ee',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Design System -->
  <link rel="stylesheet" href="/components/design-system.css">
  
  <!-- Page Title -->
  <title>{{PAGE_TITLE}} | Terrnix</title>
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  
  <!-- Canonical -->
  <link rel="canonical" href="{{CANONICAL_URL}}">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Terrnix">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="https://terrnix.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@TerrnixHQ">
  <meta name="twitter:title" content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
  <meta name="twitter:image" content="https://terrnix.com/assets/og-image.png">
  
  <!-- Organization Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Terrnix",
    "url": "https://terrnix.com",
    "logo": "https://terrnix.com/assets/logo.png",
    "sameAs": [
      "https://linkedin.com/company/terrnix",
      "https://x.com/TerrnixHQ",
      "https://github.com/talal-rgb/ecosphere-sustainability"
    ],
    "description": "AI-powered sustainability intelligence for carbon accounting, ESG reporting, and climate compliance."
  }
  </script>
  
  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://terrnix-backend.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0a0f0d">
  <meta name="robots" content="index, follow, max-image-preview:large">
</head>

<body class="bg-terrnix-bg text-white font-body min-h-screen">
  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <!-- Navigation -->
  <!--#include virtual="/components/nav.html" -->
  
  <!-- Breadcrumb (optional) -->
  <nav aria-label="Breadcrumb" class="container px-4 sm:px-6 lg:px-8 py-4">
    <ol class="flex items-center gap-2 text-sm text-gray-500">
      <li><a href="/" class="hover:text-emerald-400 transition-colors">Home</a></li>
      <li aria-hidden="true">/</li>
      <li aria-current="page" class="text-gray-400">{{PAGE_NAME}}</li>
    </ol>
  </nav>
  
  <!-- Main Content -->
  <main id="main-content">
    {{PAGE_CONTENT}}
  </main>
  
  <!-- Footer -->
  <!--#include virtual="/components/footer.html" -->
  
</body>
</html>
