<!--
  Terrnix Shared Head Component
  Include this at the top of every public page's <head>, then customize per-page variables.
  
  Per-page variables to set BEFORE including this:
  - PAGE_TITLE (required)
  - PAGE_DESCRIPTION (required)
  - CANONICAL_URL (required)
  - OG_TITLE (optional, defaults to PAGE_TITLE)
  - OG_DESCRIPTION (optional, defaults to PAGE_DESCRIPTION)
  - OG_IMAGE (optional, defaults to /assets/og-image.png)
  - SCHEMA_TYPE (optional: Article, FAQPage, WebApplication, SoftwareApplication)
  - SCHEMA_EXTRA (optional: additional JSON-LD properties)
-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon.svg">

<!-- Compiled styles -->
<link rel="stylesheet" href="/assets/css/tailwind.css">
<link rel="stylesheet" href="/components/design-system.min.css">

<!-- SEO: Title & Description -->
<title>{{PAGE_TITLE}} | Terrnix</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">

<!-- Canonical -->
<link rel="canonical" href="{{CANONICAL_URL}}">

<!-- Open Graph -->
<meta property="og:type" content="{{OG_TYPE|website}}">
<meta property="og:site_name" content="Terrnix">
<meta property="og:title" content="{{OG_TITLE|{{PAGE_TITLE}}}}">
<meta property="og:description" content="{{OG_DESCRIPTION|{{PAGE_DESCRIPTION}}}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{OG_IMAGE|https://terrnix.com/assets/og-image.png}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">

<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@TerrnixHQ">
<meta name="twitter:title" content="{{OG_TITLE|{{PAGE_TITLE}}}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION|{{PAGE_DESCRIPTION}}}}">
<meta name="twitter:image" content="{{OG_IMAGE|https://terrnix.com/assets/og-image.png}}">

<!-- Organization Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Terrnix",
  "url": "https://terrnix.com",
  "logo": "https://terrnix.com/assets/logo.png",
  "sameAs": [
    "https://linkedin.com/company/terrnix",
    "https://x.com/TerrnixHQ",
    "https://github.com/talal-rgb/ecosphere-sustainability"
  ],
  "description": "AI-powered sustainability intelligence for carbon accounting, ESG reporting, and climate compliance.",
  "foundingDate": "2024",
  "areaServed": "Global",
  "knowsAbout": [
    "Carbon Accounting",
    "ESG Reporting",
    "GHG Protocol",
    "CSRD",
    "ISSB",
    "Climate Compliance",
    "Sustainability Intelligence"
  ]
}
</script>

<!-- WebSite Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Terrnix",
  "url": "https://terrnix.com",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://terrnix.com/sustainability-intelligence/?search={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- Breadcrumb Schema (if BREADCRUMB_ITEMS is set) -->
{{BREADCRUMB_SCHEMA}}

<!-- Page-specific Schema (if SCHEMA_TYPE is set) -->
{{PAGE_SCHEMA}}

<!-- Security -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://terrnix-backend.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()">

<!-- Theme -->
<meta name="theme-color" content="#0a0f0d">
<meta name="msapplication-TileColor" content="#0a0f0d">

<!-- Robots -->
<meta name="robots" content="index, follow, max-image-preview:large">

<!-- Sitemap -->
<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
