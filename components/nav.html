<script>
  (function () {
    var button = document.getElementById('terrnix-menu-button');
    var menu = document.getElementById('terrnix-mobile-menu');
    if (!button || !menu) return;

    function closeMenu(returnFocus) {
      menu.hidden = true;
      button.setAttribute('aria-expanded', 'false');
      button.setAttribute('aria-label', 'Open navigation menu');
      if (returnFocus) button.focus();
    }

    button.addEventListener('click', function () {
      var opening = menu.hidden;
      menu.hidden = !opening;
      button.setAttribute('aria-expanded', opening ? 'true' : 'false');
      button.setAttribute('aria-label', opening ? 'Close navigation menu' : 'Open navigation menu');
    });

    menu.addEventListener('click', function (event) {
      if (event.target.closest('a')) closeMenu(false);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !menu.hidden) closeMenu(true);
    });

    document.addEventListener('click', function (event) {
      if (!menu.hidden && !menu.contains(event.target) && !button.contains(event.target)) closeMenu(false);
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth >= 1180 && !menu.hidden) closeMenu(false);
    });
  }());
</script>
