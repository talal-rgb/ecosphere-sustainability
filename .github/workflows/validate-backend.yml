name: Validate Backend and Platform

on:
  pull_request:
    paths:
      - 'backend/**'
      - '**/*.html'
      - 'assets/**'
      - 'components/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CNAME'
      - '.github/workflows/validate-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '**/*.html'
      - 'assets/**'
      - 'components/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CNAME'
      - '.github/workflows/validate-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check

  dependency-security-audit:
    name: Dependency and security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  tenant-isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Exercise tenant boundaries when the platform domain is present
        shell: bash
        run: |
          if [[ -f test/platformFoundation.test.js ]]; then
            tests=(test/platformFoundation.test.js)
            [[ -f test/authBoundary.test.js ]] && tests+=(test/authBoundary.test.js)
            node --test \
              --test-name-pattern='cross-organization|tenant middleware treats the organization header|Organization B|cross-tenant' \
              "${tests[@]}"
          else
            echo 'Tenant domain is not present in this stack layer; full backend tests remain required.'
          fi

  authorization:
    name: Authorization
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Exercise authentication and role boundaries when present
        shell: bash
        run: |
          if [[ -f test/authBoundary.test.js ]]; then
            node --test \
              --test-name-pattern='session middleware rejects|tenant middleware treats|unauthenticated owner|granular roles deny|member directory RLS' \
              test/authBoundary.test.js test/platformFoundation.test.js
          else
            echo 'Authenticated platform routes are not present in this stack layer.'
          fi

  entitlements:
    name: Entitlements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Exercise plan and feature gates when present
        shell: bash
        run: |
          if [[ -f test/platformFoundation.test.js ]]; then
            node --test \
              --test-name-pattern='commercial plan matrix|plan entitlements|gated independently|feature checks return limits' \
              test/platformFoundation.test.js
          else
            echo 'Entitlements are not present in this stack layer.'
          fi

  migration-validation:
    name: Migration validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate migration numbering and execute migration integration tests
        shell: bash
        run: |
          if [[ ! -d db/migrations ]]; then
            echo 'No database migrations exist in this stack layer.'
            exit 0
          fi
          mapfile -t migrations < <(find db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          for index in "${!migrations[@]}"; do
            expected=$(printf '%03d_' "$((index + 1))")
            if [[ "${migrations[$index]}" != "$expected"* ]]; then
              echo "Expected migration prefix $expected, found ${migrations[$index]}" >&2
              exit 1
            fi
          done
          tests=()
          [[ -f test/authBoundary.test.js ]] && tests+=(test/authBoundary.test.js)
          [[ -f test/platformFoundation.test.js ]] && tests+=(test/platformFoundation.test.js)
          if ((${#tests[@]})); then
            node --test --test-name-pattern='migration creates|platform migration creates' "${tests[@]}"
          fi

  postgres-tenant-isolation:
    name: PostgreSQL tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: terrnix_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-e2e-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terrnix_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run real PostgreSQL isolation journey
        env:
          STAGING_E2E_CONFIRM: ephemeral-only
          STAGING_TEST_DATABASE_URL: postgresql://postgres:postgres-e2e-only@localhost:5432/terrnix_e2e
        run: node --test test/postgresTenantIsolation.test.js

  deployment-compatibility:
    name: Cloudflare and deployment compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static edge-hosting contract
        shell: bash
        run: |
          [[ "$(tr -d '\r\n' < CNAME)" == 'terrnix.com' ]]
          python scripts/validate-static-site.py
          if grep -RIn --include='*.html' '<!--[[:space:]]*#include' .; then
            echo 'Runtime SSI directives are incompatible with the static deployment.' >&2
            exit 1
          fi
      - name: Validate backend deployment entrypoint
        run: node --check backend/server.js
