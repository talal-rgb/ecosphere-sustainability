name: Validate Static Shared Components

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/css/**'
      - 'components/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/render-shared-components.py'
      - 'tailwind.config.js'
      - 'tailwind.home.config.js'
      - 'tailwind.platform.config.js'
      - '.github/workflows/validate-static-components.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/css/**'
      - 'components/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/render-shared-components.py'
      - 'tailwind.config.js'
      - 'tailwind.home.config.js'
      - 'tailwind.platform.config.js'
      - '.github/workflows/validate-static-components.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend build dependencies
        run: npm ci

      - name: Verify compiled Tailwind CSS
        run: npm run check:css

      - name: Verify committed static components
        run: python scripts/render-shared-components.py --check

      - name: Validate static structure and internal links
        run: python scripts/validate-static-site.py

      - name: Validate inline JavaScript
        run: node scripts/validate-inline-js.js

      - name: Reject runtime SSI directives
        run: |
          if grep -RIn --include='*.html' '<!--[[:space:]]*#include' .; then
            echo 'Runtime SSI directives are not supported by GitHub Pages.'
            exit 1
          fi
